# Frameback CI: unit tests, lint and a production build on every push and PR.
# The upstream ViTransfer workflows (Docker Hub publishing, wiki sync, dev-branch
# automation) were removed for this fork.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
