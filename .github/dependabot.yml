version: 2

# Frameback (fork of ViTransfer): weekly dependency PRs against main.
# Security updates always target main. Major versions are ignored; they are
# handled deliberately when merging upstream ViTransfer.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # One PR a week for routine churn. There is deliberately no
      # security-updates group here: `target-branch` applies to version updates
      # only, so Dependabot opens security PRs against the default branch and
      # ignores this file's groups and commit prefix entirely. A group here
      # would read as if advisories arrive on dev, and they do not.
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: docker
    groups:
      docker:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      pip:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
